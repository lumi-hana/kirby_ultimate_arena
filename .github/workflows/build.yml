name: Build 3DSX
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: ls -l kirby_arena.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: kirby_arena-3dsx
          path: |
            kirby_arena.3dsx
